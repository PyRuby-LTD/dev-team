# Work-item example: every field an item can carry, from capture through to publish.
# Any field may appear on any type; nothing is required or forbidden by type. The per-type
# examples (story, draft-story, task, bug, epic) show what each kind usually contains.
# The requirements sit at the root: analysis and answering write them, and questions keep
# their answers. Every run of every step adds an entry to step_outputs with its outcome, the
# step it leads to, and what it produced, in the shape its workflow's `output` schema gives.
# An entry is passed once the step it leads to has recorded its own outcome, so the entries
# not yet passed are what a step must address. Passed entries stay as the item's history.

# Identity and position in the workflow
id: STORY-NNN
type: story # epic, story, task, bug or request
title: Log requests to the API
parent: EPIC-NNN # the item this one belongs to
depends_on: # leave it off when this item has no dependencies
  - STORY-NNN
workflow: default
step: publish

# Requirements: captured, then revised by analysis and answering
overview: | # the outcome or "As a ..." statement
  As a Support engineer,
  I want access logs to be captured
  So that I can see activity against the API
scope: | # a public API change carries the proposed contract in full
  The existing log setup writes application logs in plain text. There are currently
  no access logs captured.
context: # the files and functions involved, relative to the project root
change: # what to change
current_behaviour:
expected_behaviour:
steps_to_reproduce: []
acceptance_criteria:
  - An access log contains the fields "date-time", "request method", "request path", "response status"
  - Access logs are written at INFO level
  - Access logs for responses that have an exception also log their exception message and stack trace
  - Access log messages are written as structured JSON, with multiline log entries written as a single entry
  - An access log does not capture request or response body payloads. These can contain sensitive information that should not be exposed in logs.
personas_affected: # every persona this item touches, named in the Testing ACs
  - Support engineer
glossary_changes:
  - name: Access log
    description: A log entry written to capture requests that reach the REST API and what the outcome was
persona_changes:
  - name: Support engineer
    description: The person responsible for ensuring the production application is working properly. When the system is not healthy, it is their job to investigate and raise bugs to fix the problem.
standards: # chosen from the available standards; names are files in standards/ without the extension
  - name: api-contracts
    reason: Adds no endpoints, but the access log records request paths and statuses defined by the contract
  - name: quality
    reason: Support engineer journeys depend on the log format
questions: # analysis adds questions to the end; answering fills in each answer
  - question: |
      What level should the logs be written at?
      a) Write 2xx requests at DEBUG, 3xx and 4xx at INFO and 5xx at ERROR
      b) Write them all at INFO
      c) Write them all at DEBUG
      d) Something else?
    answer: b - Access logs should always be written at INFO

# Each run of each step, oldest first
step_outputs:
  - step: captured
    outcome: analyse
    to: analysis
    passed: true
  - step: analysis # an output of `requirements` is merged into the root and kept here as history
    outcome: questions
    to: answering
    passed: true
    output:
      overview: |
        As a Support engineer,
        I want access logs to be captured
        So that I can see activity against the API
      questions:
        - question: |
            What level should the logs be written at?
            a) Write 2xx requests at DEBUG, 3xx and 4xx at INFO and 5xx at ERROR
            b) Write them all at INFO
            c) Write them all at DEBUG
            d) Something else?
  - step: answering
    outcome: answered
    to: analysis
    passed: true
    output:
      questions:
        - question: |
            What level should the logs be written at?
            a) Write 2xx requests at DEBUG, 3xx and 4xx at INFO and 5xx at ERROR
            b) Write them all at INFO
            c) Write them all at DEBUG
            d) Something else?
          answer: b - Access logs should always be written at INFO
  - step: analysis
    outcome: analysed
    to: challenge
    passed: true
    output:
      acceptance_criteria:
        - Access logs are written at INFO level
  - step: challenge
    outcome: sound
    to: ready
    passed: true
    output:
      findings:
        - concern: Date time format
          finding: The date-time format in the log timestamp property is non-standard and was not supplied by the customer. Use standard ISO format date-times
  - step: ready
    outcome: play
    to: implement
    passed: true
    output:
      standards: # when left off, the standards on the item apply
        - api-contracts
        - quality
        - platform
  - step: implement
    outcome: implemented
    to: test
    passed: true
    output:
      branch: devteam/STORY-NNN
      libraries_added:
        - name: logstash-logback-encoder
          licence: Apache-2.0
      surprises:
        - Found 2 different log libraries available in the application. Configured access logging in logback.properties.
      opinions: # introduced outside the scope of the item
        - Introduced the logstash JSON appender library
  - step: test
    outcome: written
    to: sync
    passed: true
    output:
      journeys:
        - journey: journeys/support-engineer/diagnose-failure.feature
          action: extend # extend, new or none; none carries a reason
          personas:
            - Support engineer
  - step: sync
    outcome: completed
    to: verify
    passed: true
  - step: verify
    outcome: passed
    to: review
    passed: true
  - step: review # sent back: passed when implement records its next outcome
    outcome: revise
    to: implement
    passed: true
    output:
      findings:
        - location: ui/src/components/recipes/Recipe:112
          concern: glossary
          finding: Recipe shows a list of "labels" which should be a list of "tags".
          outcome: fix # fix or task
        - concern: testing
          finding: Expected a journey test to be updated for filtering recipes
          outcome: task
          task: TASK-NNN
  - step: implement
    outcome: implemented
    to: test
    passed: true
    output:
      tech_tasks: # refactors proposed rather than done in this item
        - TASK-NNN
  - step: test
    outcome: written
    to: sync
    passed: true
  - step: sync
    outcome: completed
    to: verify
    passed: true
  - step: verify
    outcome: passed
    to: review
    passed: true
  - step: review
    outcome: approve
    to: accept
    passed: true
  - step: accept
    outcome: pr # with revise, output carries the feedback for the implementer
    to: sync-publish
    passed: true
  - step: sync-publish
    outcome: completed
    to: verify-publish
    passed: true
  - step: verify-publish
    outcome: passed
    to: publish
    passed: true
  - step: publish # the pull request body; the PR title is the item title
    outcome: published
    to: pull-request
    output:
      pull_request: 123
      summary: Create an access log with one entry per request
      surprises: # collated from implementation and testing
        - Found 2 different log libraries available in the application. Configured access logging in logback.properties.
      opinions:
        - Introduced the logstash JSON appender library
