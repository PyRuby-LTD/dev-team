# Which engine and model each role uses. Workflow steps in workflows/*.json name
# their owning role as agent:<role>.

[engines.claude]
# {prompt} {model} {cwd} {brief} {extra_dir} {permission} {max_turns} are
# substituted per invocation. {extra_dir} is the backlog directory holding the work items.
command = [
  "claude", "-p", "{prompt}",
  "--model", "{model}",
  "--append-system-prompt", "{brief}",
  "--add-dir", "{extra_dir}",
  "--permission-mode", "{permission}",
  # Shell commands these roles may run unattended; file edits are covered by {permission}.
  "--allowedTools", "Bash(uv run python -m devteam *) Bash(git diff *) Bash(git log *) Bash(git status *) Bash(gh pr create *) Bash(gh pr list *) Bash(gh pr edit *)",
  "--max-turns", "{max_turns}",
  "--output-format", "stream-json", "--verbose",
]
permission = "acceptEdits"
stream = "claude-json"

[engines.codex]
command = [
  "codex", "exec", "{prompt}",
  "--model", "{model}",
  "--cd", "{cwd}",
  "--add-dir", "{extra_dir}",
  "--sandbox", "{permission}",
  "--skip-git-repo-check",
]
permission = "workspace-write"
stream = "text"

# The project's check: what `devteam check` and a workflow step owned by "check"
# run in the product repository. Agents call `devteam check`, never make itself.
[check]
command = ["make", "regression"]
one = "TEST={name}"   # appended to run a single test
timeout = 1800        # seconds; a run that exceeds it has failed

# One entry per role. Swap engine/model freely; that is the point of the file.
# branch = true puts the checkout on branch devteam/<item id> before the role runs;
# only one item at a time holds the checkout. record = true first commits a copy
# of the work item to docs/work-items/ on that branch. push = true then pushes
# the branch to origin, since an agent's sandbox may not be able to write .git.
[roles.product_owner]
engine = "claude"
model = "sonnet"
max_turns = 30

[roles.analyst]
engine = "claude"
model = "sonnet"
max_turns = 30

# Deliberately a stronger model than the analyst whose work it attacks.
[roles.challenger]
engine = "claude"
model = "opus"
max_turns = 30

[roles.implementer]
engine = "codex"
model = "gpt-6.1-sol"
max_turns = 60
branch = true

# Runs outside a sandbox so `devteam check` can start the system under test.
[roles.tester]
engine = "claude"
model = "sonnet"
max_turns = 60
branch = true

[roles.reviewer]
engine = "claude"
model = "sonnet"
max_turns = 30
branch = true

[roles.publisher]
engine = "claude"
model = "sonnet"
max_turns = 20
branch = true
record = true
push = true

[roles.architect]
engine = "claude"
model = "sonnet"
max_turns = 30

[roles.platform_engineer]
engine = "claude"
model = "sonnet"
max_turns = 30

[roles.quality_lead]
engine = "claude"
model = "sonnet"
max_turns = 30
