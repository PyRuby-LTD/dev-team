# Which engine and model each role uses. Workflow steps in workflows/*.json name
# their owning role as agent:<role>.

[engines.claude]
# {prompt} {model} {cwd} {brief} {extra_dir} {permission} {max_turns} are
# substituted per invocation. {extra_dir} is the backlog directory holding the work items.
command = [
  "claude", "-p", "{prompt}",
  "--model", "{model}",
  "--append-system-prompt", "{brief}",
  "--add-dir", "{extra_dir}",
  "--permission-mode", "{permission}",
  "--max-turns", "{max_turns}",
  "--output-format", "text",
]
permission = "acceptEdits"

[engines.codex]
command = [
  "codex", "exec", "{prompt}",
  "--model", "{model}",
  "--cd", "{cwd}",
  "--add-dir", "{extra_dir}",
  "--sandbox", "{permission}",
  "--skip-git-repo-check",
]
permission = "workspace-write"

# One entry per role. Swap engine/model freely; that is the point of the file.
# branch = true puts the checkout on branch devteam/<item id> before the role runs;
# only one item at a time holds the checkout. record = true first commits a copy
# of the work item to docs/work-items/ on that branch. push = true then pushes
# the branch to origin, since an agent's sandbox may not be able to write .git.
[roles.product_owner]
engine = "claude"
model = "sonnet"
max_turns = 12

[roles.analyst]
engine = "claude"
model = "sonnet"
max_turns = 30

[roles.implementer]
engine = "codex"
model = "gpt-6.1-sol"
max_turns = 60
branch = true

[roles.reviewer]
engine = "claude"
model = "sonnet"
max_turns = 30
branch = true

[roles.publisher]
engine = "claude"
model = "sonnet"
max_turns = 20
branch = true
record = true
push = true
