# Which engine and model each role uses. Workflow steps in workflows/*.json name
# their owning role as agent:<role>.

[engines.claude]
# {prompt} {model} {cwd} {brief} {extra_dir} {permission} {max_turns} are
# substituted per invocation. {extra_dir} is the workspace holding the work items.
command = [
  "claude", "-p", "{prompt}",
  "--model", "{model}",
  "--append-system-prompt", "{brief}",
  "--add-dir", "{extra_dir}",
  "--permission-mode", "{permission}",
  "--max-turns", "{max_turns}",
  "--output-format", "text",
]
permission = "acceptEdits"

[engines.codex]
command = [
  "codex", "exec", "{prompt}",
  "--model", "{model}",
  "--cd", "{cwd}",
  "--add-dir", "{extra_dir}",
  "--sandbox", "{permission}",
  "--skip-git-repo-check",
]
permission = "workspace-write"

# One entry per role. Swap engine/model freely; that is the point of the file.
# worktree = true runs the role in a git worktree on branch devteam/<item id>.
[roles.product_owner]
engine = "claude"
model = "sonnet"
max_turns = 12

[roles.analyst]
engine = "claude"
model = "sonnet"
max_turns = 30

[roles.implementer]
engine = "codex"
model = "gpt-6.1-sol"
max_turns = 60
worktree = true

[roles.reviewer]
engine = "claude"
model = "sonnet"
max_turns = 30
worktree = true
